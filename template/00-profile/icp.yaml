# Критерии ICP для fit-score: по 0–2 за критерий. Редактируется в CRM (Банк фактов → Критерии ICP) и агентом.

criteria:
  - id: format
    name: Формат и таймзона
    target: удалёнка или гибрид в моём городе; пересечение с командой не меньше 4 часов в мой рабочий день
    reject: только офис в другом городе или стране; синхронные созвоны ночью по моему времени
  - id: hiring
    name: Найм и право на работу
    target: нанимают там, где я живу, — в штат, через EoR или контрактором
    reject: требуют гражданство, вид на жительство или проживание в стране, где у меня нет права на работу
  - id: segment
    name: Сегмент
    target: продукт или отрасль, где мой опыт даёт преимущество и мне самому интересно
    reject: отрасль, где у меня нет ни опыта, ни интереса
  - id: stage
    name: Стадия компании
    target: есть продукт, клиенты и финансирование; процессы ещё складываются и мой вклад заметен
    reject: идея без денег и клиентов; огромная корпорация, где роль сводится к согласованиям
  - id: role
    name: Роль и масштаб
    target: мой уровень или шаг вверх; понятная зона ответственности и метрика, которой я владею
    reject: шаг вниз по уровню; размытые обязанности «помогать команде» без владения результатом
  - id: comp
    name: Компенсация
    target: вилка указана или названа на первом звонке и не ниже моей нижней границы
    reject: вилка заметно ниже рынка для этой роли
